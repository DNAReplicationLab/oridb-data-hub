name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyBigWig
        run: pip install pyBigWig numpy

      # A hub that is wrong fails in the browser with a message naming a line in a file
      # the reader has never seen, so every push is checked here instead. Sequence names
      # are checked per assembly, against <genome>.chrom.sizes beside hub.txt.
      - name: Validate the hub
        run: python3 bin/validate_hub.py --hub-root .

      # Every dataset directory present on every assembly in genomes.txt is regenerated
      # from its spec, so a hand-edited trackDb.txt cannot be committed. The list is
      # discovered rather than written out: adding a dataset should not mean editing CI.
      - name: trackDb is in sync with the dataset directories
        run: |
          set -e
          for genome in $(awk '/^genome /{print $2}' genomes.txt); do
            for dir in "$genome"/*/; do
              dataset=$(basename "$dir")
              spec="docs/containers_${dataset}_${genome}.json"
              [ -f "$spec" ] || spec="docs/containers_${dataset}.json"
              if [ ! -f "$spec" ]; then
                echo "no container spec for $genome/$dataset"; exit 1
              fi
              python3 bin/make_trackhub.py --hub-root . --genome "$genome" \
                --dataset "$dataset" --spec "$spec"
            done
          done
          git diff --exit-code -- $(awk '/^genome /{print $2}' genomes.txt) \
            || { echo "trackDb.txt is out of date; re-run bin/make_trackhub.py and commit"; exit 1; }
